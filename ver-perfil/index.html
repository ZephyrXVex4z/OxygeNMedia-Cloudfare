<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfiles — OxygeNMedia</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5b8def">
<link rel="stylesheet" href="/efectos-perfil.css">
<script src="/tema-inline.js"></script>
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --accent-hover: #4a7ad9; --text: #e8ecf5; --text-dim: #8b96b0;
    --success: #4caf7d;
    --radius: 14px;
    --card-shadow: none;
    --input-bg: #10182a;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-weight-heading: 700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: var(--font-weight-heading); }
  button {
    font-family: var(--font-body);
    background: var(--accent); color: white; border: none; padding: 10px 16px;
    border-radius: var(--radius); font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  button.secondary:hover { background: var(--card); }
  .container { max-width: 560px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }

  input {
    width: 100%; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 14px;
  }
  .search-result {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: var(--radius); margin-top: 8px; background: var(--input-bg);
    cursor: pointer;
  }
  .search-result:hover { background: #17223a; }
  .search-avatar {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white; flex-shrink: 0;
  }
  .search-info .nombre { font-size: 14px; font-weight: 600; }
  .search-info .username { font-size: 12px; color: var(--text-dim); }

  .avatar-big {
    width: 76px; height: 76px; border-radius: 50%; object-fit: cover;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: white;
    border: 3px solid var(--card); flex-shrink: 0;
  }
  .avatar-sobre-banner { position: absolute; left: 16px; bottom: -18px; }
  .profile-header {
    display: flex; align-items: flex-end; gap: 14px; text-align: left;
    margin: 0 0 16px; min-height: 20px;
  }
  .profile-header .info { min-width: 0; }
  .profile-header h2 { margin: 0 0 2px 0; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .profile-header .username { color: var(--accent); font-size: 14px; }
  .estado-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--input-bg); margin-left: 4px; }

  .roles-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; margin: 14px 0; }
  .role-chip {
    background: rgba(91,141,239,0.15); color: var(--accent);
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
  }
  .descripcion-box {
    background: var(--input-bg); border-radius: var(--radius); padding: 14px; font-size: 14px;
    color: var(--text); white-space: pre-wrap; margin-top: 10px;
  }
  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--text-dim); padding: 20px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>🔎 Perfiles</h1>
  <a href="/"><button class="secondary">Volver al sitio</button></a>
</header>

<div class="container">
  <div class="card" id="buscadorCard">
    <h3 style="margin-top:0;">Buscar por nombre o @usuario</h3>
    <input type="text" id="buscarUsername" placeholder="Nombre o @usuario...">
    <div id="resultadosBusqueda"></div>
  </div>

  <div class="card hidden" id="perfilCard">
    <button class="secondary" id="btnVolverBusqueda" style="margin-bottom:14px;">← Volver a buscar</button>
    <div id="verBannerPerfil" style="position:relative; height:150px; border-radius:var(--radius); overflow:hidden; margin-bottom:28px;">
      <canvas id="verCanvasEfecto" style="position:absolute; inset:0; width:100%; height:100%;"></canvas>
      <div class="avatar-sobre-banner">
        <img id="verAvatarImg" class="avatar-big hidden">
        <div id="verAvatarInicial" class="avatar-big"></div>
      </div>
    </div>
    <div class="profile-header">
      <div class="info">
        <h2><span id="verNombre"></span><span id="verInsignias"></span><span class="estado-chip" id="estadoChipAjeno"></span></h2>
        <div class="username" id="verUsername"></div>
        <div class="seguidores-count" id="verSeguidores" style="font-size:12.5px; color:var(--text-dim); margin-top:2px; cursor:pointer;"></div>
      </div>
    </div>
    <div class="roles-list" id="verRoles"></div>
    <div class="descripcion-box hidden" id="verDescripcion"></div>
    <div id="seccionRedesSociales" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;"></div>
    <div id="seccionMusicaPerfil"></div>
    <button id="btnSeguir" class="secondary" style="width:100%; margin-top:18px;"></button>
    <button id="btnAmistad" class="secondary" style="width:100%; margin-top:10px;"></button>
    <button id="btnChatearDesdeAqui" style="width:100%; margin-top:10px;">💬 Enviar mensaje</button>
    <button id="btnReportarUsuario" class="secondary" style="width:100%; margin-top:10px; color:var(--danger);"><img src="/reportar-32.png" style="width:14px;height:14px;vertical-align:-2px;"> Reportar usuario</button>
    <button id="btnBloquearUsuario" class="secondary" style="width:100%; margin-top:10px;"></button>
  </div>
</div>

<style>
  #verInsignias { margin-left: 4px; vertical-align: middle; }
  #verInsignias .badge-verificado { width: 18px; height: 18px; }
  .red-social-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--text); text-decoration: none; font-size: 13px;
  }
  .red-social-chip:hover { border-color: var(--accent); }
  /* Efectos de perfil: ver el <link> en el <head>, arriba — no @import aquí,
     porque un @import después de otras reglas se ignora en silencio. */
</style>

<script type="module" src="/ver-perfil.js"></script>
</body>
</html>
