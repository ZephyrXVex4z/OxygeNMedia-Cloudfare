<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaStore — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0F;--surface:#14161D;--surface-2:#1B1E27;--line:#262933;
    --text:#EDEDF2;--text-dim:#8B8D9B;--accent:#7C5CFF;--accent-2:#FF6B4A;
    --danger:#E5484D;--ok:#3DD68C;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,.serif{font-family:'Fraunces',serif}
  input,textarea,button{font-family:inherit}
  #loginScreen{
    min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-box{
    width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);padding:36px 32px;
  }
  .login-box h1{font-size:24px;margin:0 0 6px;font-weight:500}
  .login-box p{color:var(--text-dim);font-size:14px;margin:0 0 28px}
  label{display:block;font-size:13px;color:var(--text-dim);margin:0 0 6px}
  .field{margin-bottom:16px}
  input[type=email], input[type=password], input[type=text], input[type=number], textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:11px 12px;font-size:14.5px;outline:none;
  }
  input:focus, textarea:focus{border-color:var(--accent)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#fff;border:none;padding:12px 18px;
    font-size:14.5px;font-weight:600;cursor:pointer;width:100%;
  }
  .btn:hover{background:#6c4ef0}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .btn-outline{background:none;border:1px solid var(--line);color:var(--text)}
  .btn-outline:hover{border-color:#3a3d4d}
  .btn-danger{background:var(--danger)}
  .btn-danger:hover{background:#c93e42}
  .error-msg{color:var(--danger);font-size:13.5px;margin-top:14px;display:none}
  #dashboard{display:none;min-height:100%}
  header{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(20px,4vw,48px);background:rgba(10,11,15,0.9);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
  .logo span{color:var(--accent)}
  .logo small{color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:400;font-size:12px;margin-left:8px}
  .top-actions{display:flex;gap:10px;align-items:center}
  .top-actions button{width:auto}

  main{max-width:1080px;margin:0 auto;padding:36px clamp(20px,4vw,48px) 90px}

  .panel{background:var(--surface);border:1px solid var(--line);padding:26px;margin-bottom:32px}
  .panel h2{font-size:17px;font-weight:500;margin:0 0 20px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:600px){.row{grid-template-columns:1fr}}
  textarea{min-height:90px;resize:vertical}

  .drop{
    border:1px dashed var(--line);padding:20px;text-align:center;color:var(--text-dim);
    cursor:pointer;font-size:13.5px;position:relative;overflow:hidden;
  }
  .drop.has-image{border-style:solid;padding:0}
  .drop img{width:100%;max-height:220px;object-fit:cover;display:block}
  .drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

  .panel-actions{display:flex;gap:12px;margin-top:20px;align-items:center}
  .panel-actions .btn{width:auto;padding:11px 20px}
  .status-line{font-size:13px;color:var(--text-dim)}
  .status-line.ok{color:var(--ok)}
  .status-line.err{color:var(--danger)}

  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--text-dim);font-weight:500;font-size:12.5px;padding:0 12px 12px;border-bottom:1px solid var(--line)}
  td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.thumb{width:56px}
  td.thumb img{width:44px;height:44px;object-fit:cover;display:block;background:var(--surface-2)}
  td.thumb .ph{width:44px;height:44px;background:var(--surface-2)}
  .name-cell{max-width:260px}
  .name-cell .n{font-weight:500}
  .name-cell .d{color:var(--text-dim);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .price-cell{color:var(--accent-2);font-family:'Fraunces',serif}
  .actions-cell{white-space:nowrap;text-align:right}
  .icon-btn{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    padding:6px 10px;font-size:12.5px;cursor:pointer;margin-left:6px;width:auto;
  }
  .icon-btn:hover{color:var(--text);border-color:#3a3d4d}
  .icon-btn.danger:hover{color:var(--danger);border-color:var(--danger)}
  .badge{
    font-size:11px;padding:2px 8px;border:1px solid var(--line);color:var(--text-dim);display:inline-block;
  }
  .badge.inactive{color:var(--danger);border-color:var(--danger)}
  .empty-row td{color:var(--text-dim);text-align:center;padding:40px 12px}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>nova<span style="color:var(--accent)">store</span> admin</h1>
    <p>Inicia sesión para administrar el catálogo.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="loginBtn">Iniciar sesión</button>
      <p class="error-msg" id="loginError"></p>
    </form>
  </div>
</div>

<div id="dashboard">
  <header>
    <div class="logo">Nova<span>Store</span><small id="userEmail"></small></div>
    <div class="top-actions">
      <a href="/NovaStore/" class="btn btn-outline" style="text-decoration:none;padding:9px 16px;font-size:13.5px">Ver tienda</a>
      <button class="btn btn-outline" id="logoutBtn" style="padding:9px 16px;font-size:13.5px">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2 id="formTitle">Nuevo producto</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <div class="row">
          <div class="field">
            <label for="pName">Nombre</label>
            <input type="text" id="pName" required>
          </div>
          <div class="field">
            <label for="pPrice">Precio (MXN)</label>
            <input type="number" id="pPrice" min="0" step="0.01" required>
          </div>
        </div>
        <div class="field">
          <label for="pDesc">Descripción</label>
          <textarea id="pDesc" placeholder="Detalles, materiales, tamaño, etc."></textarea>
        </div>
        <div class="field">
          <label>Foto</label>
          <label class="drop" id="dropZone">
            <span id="dropLabel">Toca para elegir una imagen (JPG/PNG/WEBP)</span>
            <input type="file" id="pImage" accept="image/*">
          </label>
        </div>
        <div class="panel-actions">
          <button type="submit" class="btn" id="saveBtn" style="width:auto">Publicar producto</button>
          <button type="button" class="btn btn-outline" id="cancelEditBtn" style="width:auto;display:none">Cancelar edición</button>
          <span class="status-line" id="formStatus"></span>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Productos publicados</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th></th><th>Producto</th><th>Precio</th><th>Estado</th><th></th></tr>
          </thead>
          <tbody id="productsBody">
            <tr class="empty-row"><td colspan="5">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
    query, orderBy, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDDgQ_Q1dxVN7OcxT03uupX_ZxuECS99nk",
    authDomain: "nova-store-ink.firebaseapp.com",
    projectId: "nova-store-ink",
    storageBucket: "nova-store-ink.firebasestorage.app",
    messagingSenderId: "131104612255",
    appId: "1:131104612255:web:e782455afa299285e3e7aa",
    measurementId: "G-9K9HEZDR9Q"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const R2_WORKER_URL = "https://oxygenmedia-subir-imagenes.zephyr-tech-gob.workers.dev/";
  const loginScreen = document.getElementById("loginScreen");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");
  const userEmail = document.getElementById("userEmail");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "Entrando…";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginError.textContent = friendlyAuthError(err.code);
      loginError.style.display = "block";
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Iniciar sesión";
    }
  });

  function friendlyAuthError(code){
    switch(code){
      case "auth/invalid-email": return "Correo inválido.";
      case "auth/user-not-found":
      case "auth/wrong-password":
      case "auth/invalid-credential": return "Correo o contraseña incorrectos.";
      case "auth/too-many-requests": return "Demasiados intentos. Intenta más tarde.";
      default: return "No se pudo iniciar sesión. Intenta de nuevo.";
    }
  }

  document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

  let unsubscribeProducts = null;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = "none";
      dashboard.style.display = "block";
      userEmail.textContent = user.email;
      listenProducts();
    } else {
      dashboard.style.display = "none";
      loginScreen.style.display = "flex";
      if (unsubscribeProducts) { unsubscribeProducts(); unsubscribeProducts = null; }
    }
  });
  const dropZone = document.getElementById("dropZone");
  const dropLabel = document.getElementById("dropLabel");
  const pImage = document.getElementById("pImage");
  let selectedFile = null;
  let existingImageUrl = null;

  pImage.addEventListener("change", () => {
    const file = pImage.files[0];
    if (!file) return;
    selectedFile = file;
    dropZone.classList.add("has-image");
    dropLabel.style.display = "none";
    const reader = new FileReader();
    reader.onload = (e) => {
      let img = dropZone.querySelector("img");
      if (!img) {
        img = document.createElement("img");
        dropZone.appendChild(img);
      }
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  function resetImagePicker(){
    selectedFile = null;
    existingImageUrl = null;
    pImage.value = "";
    dropZone.classList.remove("has-image");
    dropLabel.style.display = "block";
    const img = dropZone.querySelector("img");
    if (img) img.remove();
  }

  async function uploadImageToR2(file){
    const idToken = await auth.currentUser.getIdToken();

    const res = await fetch(R2_WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": file.type || "application/octet-stream",
        "X-Firebase-Token": idToken,
        "X-Tipo-Imagen": "productos",
        "X-App": "novastore",
      },
      body: file,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || ("No se pudo subir la imagen (" + res.status + ")"));
    }

    const { url } = await res.json();
    if (!url) throw new Error("Respuesta inválida del Worker de subida.");
    return url;
  }
  const productForm = document.getElementById("productForm");
  const productId = document.getElementById("productId");
  const pName = document.getElementById("pName");
  const pPrice = document.getElementById("pPrice");
  const pDesc = document.getElementById("pDesc");
  const saveBtn = document.getElementById("saveBtn");
  const cancelEditBtn = document.getElementById("cancelEditBtn");
  const formTitle = document.getElementById("formTitle");
  const formStatus = document.getElementById("formStatus");

  function setStatus(msg, kind){
    formStatus.textContent = msg;
    formStatus.className = "status-line" + (kind ? " " + kind : "");
  }

  productForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    saveBtn.disabled = true;
    setStatus("Guardando…");

    try {
      let imageUrl = existingImageUrl;
      if (selectedFile) {
        setStatus("Subiendo imagen…");
        imageUrl = await uploadImageToR2(selectedFile);
      }

      const data = {
        name: pName.value.trim(),
        price: Number(pPrice.value),
        description: pDesc.value.trim(),
        imageUrl: imageUrl || null,
      };

      if (productId.value) {
        await updateDoc(doc(db, "products", productId.value), data);
        setStatus("Producto actualizado.", "ok");
      } else {
        await addDoc(collection(db, "products"), {
          ...data,
          active: true,
          createdAt: serverTimestamp()
        });
        setStatus("Producto publicado.", "ok");
      }

      resetForm();
    } catch (err) {
      console.error(err);
      setStatus(err.message || "Error al guardar.", "err");
    } finally {
      saveBtn.disabled = false;
    }
  });

  function resetForm(){
    productForm.reset();
    productId.value = "";
    resetImagePicker();
    formTitle.textContent = "Nuevo producto";
    saveBtn.textContent = "Publicar producto";
    cancelEditBtn.style.display = "none";
  }

  cancelEditBtn.addEventListener("click", resetForm);
  const productsBody = document.getElementById("productsBody");

  function fmtPrice(n){
    const num = Number(n);
    if (Number.isNaN(num)) return n;
    return num.toLocaleString("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function listenProducts(){
    const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
    unsubscribeProducts = onSnapshot(q, (snap) => {
      if (snap.empty) {
        productsBody.innerHTML = `<tr class="empty-row"><td colspan="5">Aún no hay productos. Publica el primero arriba.</td></tr>`;
        return;
      }
      productsBody.innerHTML = "";
      snap.forEach((docSnap) => {
        const p = docSnap.data();
        const id = docSnap.id;
        const active = p.active !== false;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="thumb">${p.imageUrl ? `<img src="${p.imageUrl}" alt="">` : `<div class="ph"></div>`}</td>
          <td class="name-cell">
            <div class="n">${escapeHtml(p.name || "Sin nombre")}</div>
            ${p.description ? `<div class="d">${escapeHtml(p.description)}</div>` : ""}
          </td>
          <td class="price-cell">${p.price != null ? fmtPrice(p.price) : "—"}</td>
          <td><span class="badge ${active ? "" : "inactive"}">${active ? "Visible" : "Oculto"}</span></td>
          <td class="actions-cell">
            <button class="icon-btn" data-action="toggle" data-id="${id}" data-active="${active}">${active ? "Ocultar" : "Mostrar"}</button>
            <button class="icon-btn" data-action="edit" data-id="${id}">Editar</button>
            <button class="icon-btn danger" data-action="delete" data-id="${id}">Eliminar</button>
          </td>
        `;
        productsBody.appendChild(tr);

        tr.querySelector('[data-action="edit"]').addEventListener("click", () => startEdit(id, p));
        tr.querySelector('[data-action="toggle"]').addEventListener("click", () => toggleActive(id, active));
        tr.querySelector('[data-action="delete"]').addEventListener("click", () => removeProduct(id, p.name));
      });
    }, (err) => {
      console.error(err);
      productsBody.innerHTML = `<tr class="empty-row"><td colspan="5">No se pudo cargar el catálogo.</td></tr>`;
    });
  }

  function startEdit(id, p){
    productId.value = id;
    pName.value = p.name || "";
    pPrice.value = p.price != null ? p.price : "";
    pDesc.value = p.description || "";
    existingImageUrl = p.imageUrl || null;
    selectedFile = null;
    pImage.value = "";

    if (p.imageUrl) {
      dropZone.classList.add("has-image");
      dropLabel.style.display = "none";
      let img = dropZone.querySelector("img");
      if (!img) { img = document.createElement("img"); dropZone.appendChild(img); }
      img.src = p.imageUrl;
    } else {
      resetImagePicker();
    }

    formTitle.textContent = "Editar producto";
    saveBtn.textContent = "Guardar cambios";
    cancelEditBtn.style.display = "inline-flex";
    setStatus("");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function toggleActive(id, currentlyActive){
    try {
      await updateDoc(doc(db, "products", id), { active: !currentlyActive });
    } catch (err) {
      alert("No se pudo actualizar: " + err.message);
    }
  }

  async function removeProduct(id, name){
    if (!confirm(`¿Eliminar "${name || "este producto"}"? Esta acción no se puede deshacer.`)) return;
    try {
      await deleteDoc(doc(db, "products", id));
    } catch (err) {
      alert("No se pudo eliminar: " + err.message);
    }
  }
</script>
</body>
</html>
