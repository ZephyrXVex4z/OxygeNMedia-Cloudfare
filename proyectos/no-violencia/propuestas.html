<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propuestas | Comunidad sin violencia</title>
  <style>
    :root { --blue:#0757a8; --dark:#073b73; --cyan:#11a9c8; --bg:#f5f9fc; --white:#fff; --text:#17233a; --muted:#647286; --border:#d9e4ec; --green:#16846e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }

    header {
      background: linear-gradient(135deg, var(--dark), var(--blue), var(--cyan));
      color: #fff;
      padding: 22px 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }
    header .wrap { max-width: 1050px; margin: auto; }
    header .brand { font-weight: 900; font-size: 1.15rem; opacity: .85; margin-bottom: 4px; }
    header h1 { margin: 0 0 4px; font-size: 1.7rem; }
    header p { margin: 0; opacity: .85; }

    main { max-width: 1050px; margin: auto; padding: 28px 18px 60px; }

    .panel, .proposal { background: var(--white); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 8px 25px rgba(20,55,90,.07); }
    .login { max-width: 460px; margin: 30px auto; }
    .login h2 { margin-top: 0; }

    label { display: block; font-weight: 800; margin: 13px 0 6px; }
    input {
      width: 100%; padding: 12px; border: 1px solid #cbd9e3; border-radius: 10px; font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(17,169,200,.12); }

    button { border: 0; border-radius: 10px; padding: 12px 17px; background: var(--blue); color: #fff; font-weight: 800; cursor: pointer; margin-top: 15px; }
    button:hover { filter: brightness(.95); }
    button.secondary { background: #687587; }

    .error { color: #a52b2b; margin-top: 12px; font-weight: 600; }
    .success { color: var(--green); margin-top: 12px; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .count { color: var(--muted); }
    .hidden { display: none; }

    .meta { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
    .badge { display: inline-block; background: #dff5fa; color: var(--dark); border-radius: 999px; padding: 4px 10px; font-size: .78rem; font-weight: 800; margin: 0 4px 4px 0; }
    .estado-badge { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: .76rem; font-weight: 800; text-transform: uppercase; }
    .estado-pendiente { background: #fff1c9; color: #6b5210; }
    .estado-revisada { background: #e5f6f1; color: var(--green); }
    .estado-otro { background: #eceff3; color: var(--muted); }

    .proposal h3 { margin: 0 0 6px; }
    .proposal p { white-space: pre-wrap; margin: 6px 0 0; }
    .proposal strong { color: var(--dark); }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 14px 0; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

    .empty { color: var(--muted); text-align: center; padding: 20px; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">OxygeNMedia</div>
    <h1>Propuestas recibidas</h1>
    <p>Panel privado para consultar las propuestas de la comunidad.</p>
  </div>
</header>

<main>
  <section id="loginPanel" class="panel login">
    <h2>Acceso</h2>
    <p>Inicia sesión con una cuenta autorizada para consultar las propuestas.</p>
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login">Iniciar sesión</button>
    <div id="loginError" class="error"></div>
  </section>

  <section id="appPanel" class="hidden">
    <div class="panel toolbar">
      <div>
        <strong>Panel de propuestas</strong>
        <div id="count" class="count">Cargando...</div>
      </div>
      <button id="logout" class="secondary">Cerrar sesión</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<script type="module">
  import { auth, db } from "/firebase-config.js";
  import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import {
    collection,
    getDocs,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const loginPanel = document.getElementById("loginPanel");
  const appPanel = document.getElementById("appPanel");
  const errorBox = document.getElementById("loginError");
  const list = document.getElementById("list");
  const count = document.getElementById("count");

  document.getElementById("login").addEventListener("click", async () => {
    errorBox.textContent = "";
    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );
    } catch (error) {
      console.error(error);
      errorBox.textContent = "No se pudo iniciar sesión. Verifica tus datos.";
    }
  });

  document.getElementById("logout").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      loginPanel.classList.remove("hidden");
      appPanel.classList.add("hidden");
      return;
    }

    loginPanel.classList.add("hidden");
    appPanel.classList.remove("hidden");
    await loadProposals();
  });

  async function loadProposals() {
    list.innerHTML = "";
    count.textContent = "Cargando...";

    try {
      const q = query(
        collection(db, "noViolenciaPropuestas"),
        orderBy("fecha", "desc")
      );
      const snapshot = await getDocs(q);
      count.textContent = `${snapshot.size} propuesta(s) recibida(s).`;

      if (snapshot.empty) {
        list.innerHTML = '<div class="panel empty">Todavía no hay propuestas.</div>';
        return;
      }

      snapshot.forEach((doc) => {
        const p = doc.data();
        const date = p.fecha?.toDate
          ? p.fecha.toDate().toLocaleString("es-MX")
          : "Fecha pendiente";

        const article = document.createElement("article");
        article.className = "proposal";

        const tags = Array.isArray(p.propuestas) && p.propuestas.length
          ? p.propuestas.map(x => `<span class="badge">${escapeHtml(x)}</span>`).join("")
          : '<span class="badge">Sin selección</span>';

        const estado = p.estado || "pendiente";
        const estadoClase = estado === "pendiente" ? "estado-pendiente"
          : estado === "revisada" ? "estado-revisada"
          : "estado-otro";

        article.innerHTML = `
          <h3>${escapeHtml(p.nombre || "Sin nombre")}</h3>
          <div class="meta">${escapeHtml(p.tipoParticipante || "Sin especificar")} · ${escapeHtml(p.lugar || "Sin lugar")} · ${escapeHtml(date)}</div>
          <div class="grid">
            <div><strong>Contacto</strong><p>${escapeHtml(p.contacto || "No proporcionado")}</p></div>
            <div><strong>Propuestas seleccionadas</strong><p>${tags}</p></div>
          </div>
          <strong>Solicitud o propuesta</strong>
          <p>${escapeHtml(p.propuesta || "")}</p>
          ${p.comentarios ? `<strong>Comentarios adicionales</strong><p>${escapeHtml(p.comentarios)}</p>` : ""}
          <div class="meta" style="margin-top:14px;">
            Estado: <span class="estado-badge ${estadoClase}">${escapeHtml(estado)}</span> · ID: ${escapeHtml(doc.id)}
          </div>
        `;

        list.appendChild(article);
      });
    } catch (error) {
      console.error(error);
      count.textContent = "";
      list.innerHTML = '<div class="panel empty">No se pudieron cargar las propuestas. Intenta recargar la página en unos minutos.</div>';
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>
</body>
</html>
