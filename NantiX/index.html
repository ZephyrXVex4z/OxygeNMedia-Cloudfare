<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NantiXBase</title>
<link rel="stylesheet" href="styles.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nx-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>

<main id="login" hidden>
  <form id="loginForm" class="login-card">
    <h1 class="logo">Nanti<b>X</b>Base</h1>
    <label>Correo electrónico<input type="email" name="email" autocomplete="username" required></label>
    <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
    <p id="loginError" class="error" role="alert"></p>
    <button class="btn primary" type="submit">Iniciar sesión</button>
    <button class="btn link" type="button" id="resetBtn">Recuperar contraseña</button>
  </form>
</main>

<div id="app" hidden>
  <header class="bar">
    <h1 class="logo">Nanti<b>X</b>Base</h1>
    <div class="bar-right">
      <span id="who" class="who"></span>
      <button class="btn" id="themeBtn" aria-label="Cambiar tema">Tema</button>
      <button class="btn" id="logoutBtn">Cerrar sesión</button>
    </div>
  </header>

  <section class="tools">
    <input id="q" type="search" placeholder="Buscar por título" aria-label="Buscar por título">
    <select id="sort" aria-label="Ordenar">
      <option value="titleLower:asc">Título A–Z</option>
      <option value="titleLower:desc">Título Z–A</option>
      <option value="updatedAt:desc">Modificación reciente</option>
      <option value="createdAt:desc">Creación reciente</option>
      <option value="createdAt:asc">Creación antigua</option>
    </select>
    <select id="filterField" aria-label="Filtrar por característica"><option value="">Sin filtro</option></select>
    <span id="filterBox"></span>
    <span class="admin-only" hidden>
      <button class="btn primary" id="addRecord">+ Añadir usuario</button>
      <button class="btn" id="addField">+ Añadir característica</button>
      <button class="btn" id="manageFields">Características</button>
    </span>
  </section>

  <div id="loading" class="loading">Cargando…</div>
  <div id="empty" class="empty" hidden>Todavía no hay fichas disponibles.</div>
  <section id="grid" class="grid" aria-live="polite"></section>
  <div class="more"><button class="btn" id="moreBtn" hidden>Cargar más</button></div>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
