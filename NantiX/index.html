<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NantiX</title>
<meta name="description" content="NantiX: biblioteca digital de enlaces de descarga de música, juegos, emuladores, aplicaciones y más.">
<meta property="og:title" content="NantiX">
<meta property="og:description" content="Biblioteca digital de enlaces de descarga organizada por categorías.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="styles.css">
<script>if(location.pathname==="/NantiX")location.replace("/NantiX/"+location.search+location.hash);</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nx-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<a class="skip" href="#main">Saltar al contenido</a>
<header class="top">
  <button class="btn icon" id="menuBtn" type="button" aria-label="Categorías" aria-expanded="false" aria-controls="side">☰</button>
  <a class="logo" href="#/home">Nanti<b>X</b></a>
  <form id="searchForm" role="search"><input id="q" type="search" aria-label="Buscar" placeholder="Buscar título, artista, plataforma o etiqueta"></form>
  <div class="top-r">
    <span id="who" class="who"></span>
    <button class="btn icon" id="themeBtn" type="button" aria-label="Cambiar tema">◐</button>
    <button class="btn" id="logoutBtn" type="button" hidden>Cerrar sesión</button>
    <a class="btn primary" id="loginLink" href="/NantiX/login/" hidden>Iniciar sesión</a>
  </div>
</header>
<div class="layout">
  <nav id="side" class="side" aria-label="Categorías"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<footer class="foot">
  <p>NantiX organiza enlaces a archivos alojados en servicios externos y no aloja los archivos. Publica solo contenido que tengas derecho a distribuir.</p>
  <button class="btn link" id="reportGen" type="button">Reportar contenido o un enlace roto</button>
</footer>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
