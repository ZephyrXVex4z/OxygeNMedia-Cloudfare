<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando Spotify — OxygeNMedia</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5b8def">
<script src="/tema-inline.js"></script>
<script src="/fuente-inline.js"></script>
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --text: #e8ecf5; --text-dim: #8b96b0; --danger: #e35d5d; --success: #4caf7d;
    --radius: 14px; --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px;
  }
  .card { max-width: 380px; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 20px; animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  h2 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--text-dim); line-height: 1.5; }
  button {
    margin-top: 16px; background: var(--accent); color: white; border: none;
    padding: 11px 20px; border-radius: var(--radius); font-size: 14px; cursor: pointer; font-weight: 600;
  }
</style>
</head>
<body>

<div class="card">
  <div class="spinner" id="spinner"></div>
  <h2 id="titulo">Conectando tu cuenta de Spotify...</h2>
  <p id="mensaje">Esto solo toma un segundo.</p>
  <button id="btnVolver" class="hidden" style="display:none;" onclick="location.href='/perfil'">Volver a mi perfil</button>
</div>

<script type="module">
import { observarSesion } from "/auth.js";
import { completarConexionSpotify } from "/spotify.js";

const titulo = document.getElementById("titulo");
const mensaje = document.getElementById("mensaje");
const spinner = document.getElementById("spinner");
const btnVolver = document.getElementById("btnVolver");

function mostrarError(texto) {
  spinner.style.display = "none";
  titulo.textContent = "No se pudo conectar";
  titulo.style.color = "var(--danger)";
  mensaje.textContent = texto;
  btnVolver.style.display = "inline-block";
}

function mostrarExito() {
  spinner.style.display = "none";
  titulo.textContent = "¡Cuenta conectada!";
  titulo.style.color = "var(--success)";
  mensaje.textContent = "Tu cuenta de Spotify ya está vinculada a OxygeNMedia.";
  btnVolver.style.display = "inline-block";
  setTimeout(() => { location.href = "/perfil"; }, 2000);
}

const params = new URLSearchParams(location.search);
const code = params.get("code");
const error = params.get("error");

if (error) {
  mostrarError(error === "access_denied" ? "Cancelaste la conexión con Spotify." : "Spotify devolvió un error: " + error);
} else if (!code) {
  mostrarError("No se recibió información de Spotify. Intenta conectar tu cuenta de nuevo desde tu perfil.");
} else {
  observarSesion(async (user) => {
    if (!user) {
      mostrarError("Debes iniciar sesión en OxygeNMedia antes de conectar Spotify.");
      return;
    }
    try {
      await completarConexionSpotify(code, user.uid);
      mostrarExito();
    } catch (err) {
      mostrarError(err.message);
    }
  });
}
</script>

</body>
</html>
